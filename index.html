<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BBQ Lab" />
  <meta name="theme-color" content="#0f0e0c" />
  <title>BBQ Lab</title>
  <link rel="preload" href="fonts/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
  <link rel="shortcut icon" href="favicon.png" />
  <link rel="manifest" href="manifest.json" />
  <style>
    /* Fonts lokal statt von fonts.googleapis.com - sonst geht bei jedem Aufruf
       die IP jedes Besuchers an Google. Dateien in fonts/, SIL Open Font
       License. DM Sans ist ein Variable Font: alle Schnitte 300-600 kommen aus
       einer Datei. Subsets latin + latin-ext, wie von Google ausgeliefert. */
    @font-face{font-family:'Bebas Neue';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/bebas-neue-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
    @font-face{font-family:'Bebas Neue';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/bebas-neue-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
    @font-face{font-family:'DM Sans';font-style:normal;font-weight:300 600;font-display:swap;src:url(fonts/dm-sans-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
    @font-face{font-family:'DM Sans';font-style:normal;font-weight:300 600;font-display:swap;src:url(fonts/dm-sans-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#0f0e0c;--surface:#1a1916;--border:#2e2c28;--accent:#e8a020;--accent2:#c45c1a;--text:#f0ede6;--muted:#7a7567;--smoke:#2a2825}
    body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
    #root{max-width:480px;margin:0 auto;min-height:100dvh}
    .header{padding:max(env(safe-area-inset-top),28px) 20px 16px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,#161411 0%,var(--bg) 100%);position:sticky;top:0;z-index:10}
    .header-top{display:flex;align-items:center;justify-content:space-between}
    .logo{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;color:var(--accent);line-height:1}
    .logo span{color:var(--muted);font-size:13px;display:block;font-family:'DM Sans',sans-serif;letter-spacing:1px;margin-top:2px}
    .badge{background:var(--smoke);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:12px;color:var(--muted)}
    .header-right{display:flex;gap:8px;align-items:center}
    .menu-wrap{position:relative}
    .menu-btn{background:var(--smoke);border:1px solid var(--border);border-radius:20px;padding:4px 14px;font-size:18px;color:var(--muted);cursor:pointer}
    .dropdown{position:absolute;right:0;top:calc(100% + 8px);background:var(--surface);border:1px solid var(--border);border-radius:12px;min-width:160px;z-index:50;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,0.4)}
    .dropdown-item{display:flex;align-items:center;gap:10px;padding:13px 16px;font-size:14px;color:var(--text);cursor:pointer;border-bottom:1px solid var(--border)}
    .dropdown-item:last-child{border-bottom:none}
    .ptr{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:center;height:0;overflow:hidden;background:var(--bg);transition:height 0.2s;z-index:20}
    .ptr-spinner{width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite}
    .ptr-text{color:var(--muted);font-size:12px;margin-left:8px}
    .toast{position:fixed;left:16px;right:16px;max-width:420px;margin-inline:auto;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--surface);border:1px solid var(--border);border-left:4px solid #ef4444;border-radius:10px;padding:12px 14px;color:var(--text);font-size:13px;line-height:1.45;box-shadow:0 6px 24px rgba(0,0,0,0.55);opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity 0.2s,transform 0.2s}
    .toast.show{opacity:1;transform:translateY(0)}
    @keyframes spin{to{transform:rotate(360deg)}}
    .fab{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));right:24px;z-index:50;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;font-size:30px;cursor:pointer;box-shadow:0 4px 20px rgba(232,160,32,0.4);display:flex;align-items:center;justify-content:center}
    .list{padding:16px 20px 100px;display:flex;flex-direction:column;gap:12px}
    .entry-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;position:relative;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
    .entry-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--st-color, linear-gradient(180deg,var(--accent),var(--accent2)))}
    .card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
    .card-name{font-size:16px;font-weight:600;color:var(--text)}
    .card-date{font-size:11px;color:var(--muted);margin-top:2px}
    .status-pill{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:500;white-space:nowrap}
    .stars{font-size:15px;letter-spacing:1px;margin-bottom:4px}
    .card-anwendung{font-size:12px;color:var(--accent);margin-bottom:4px}
    .card-note{font-size:13px;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .ing-count{font-size:11px;color:var(--muted);margin-top:4px}
    .empty{text-align:center;padding:60px 20px;color:var(--muted)}
    .empty-icon{font-size:48px;margin-bottom:12px}
    .empty h3{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--text);letter-spacing:1px;margin-bottom:6px}
    .form-wrap{padding:calc(max(env(safe-area-inset-top),20px) + 20px) 20px 80px}
    .form-header{display:flex;align-items:center;gap:12px;margin-bottom:24px}
    .back-btn{background:var(--smoke);border:1px solid var(--border);color:var(--text);font-size:18px;width:36px;height:36px;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .form-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1px;color:var(--accent)}
    .field{margin-bottom:16px}
    .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;display:block}
    input,textarea,select{width:100%;background:var(--smoke);border:1px solid var(--border);border-radius:10px;padding:10px 14px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
    input:focus,textarea:focus,select:focus{border-color:var(--accent)}
    textarea{resize:vertical;min-height:80px}
    .stars-input{display:flex;gap:6px}
    .star-btn{background:none;border:none;font-size:28px;cursor:pointer;line-height:1;padding:4px;width:auto}
    .name-row{display:flex;gap:8px;align-items:center}
    .name-row input{flex:1}
    .ver-badge{background:var(--smoke);border:1px solid var(--border);border-radius:10px;padding:10px 8px;color:var(--accent);font-family:'Bebas Neue',sans-serif;font-size:16px;white-space:nowrap;display:flex;align-items:center;gap:2px;flex-shrink:0}
    .ver-badge input{width:32px;background:transparent;border:none;border-bottom:1px solid var(--accent);color:var(--accent);font-family:'Bebas Neue',sans-serif;font-size:16px;text-align:center;outline:none;padding:0 2px;border-radius:0}
    .ing-block{background:var(--smoke);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:16px}
    .ing-title{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
    .frac-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px}
    .frac-row{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
    .frac-btn{background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--accent);font-size:15px;font-weight:600;padding:6px 12px;cursor:pointer;line-height:1;width:auto}
    .col-labels{display:flex;gap:6px;margin-bottom:4px;padding-right:28px}
    .col-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px}
    .col-lbl.qty{width:56px;flex-shrink:0}
    .col-lbl.unit{width:82px;flex-shrink:0}
    .col-lbl.name{flex:1}
    .ing-row{display:flex;gap:6px;margin-bottom:8px;align-items:center}
    .ing-qty{width:56px!important;flex-shrink:0;padding:8px 6px!important;text-align:center;font-size:16px;font-weight:600;color:var(--accent)!important}
    .ing-unit{width:82px!important;flex-shrink:0;padding:8px 6px!important;font-size:16px!important}
    .ing-name{flex:1;padding:8px 10px!important}
    .ing-del{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:4px;flex-shrink:0;width:28px!important}
    .add-ing{background:none!important;border:1px dashed var(--border)!important;color:var(--muted)!important;font-size:13px;padding:10px;cursor:pointer;margin-top:4px;width:100%!important;border-radius:8px}
    .save-btn{width:100%!important;padding:16px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;cursor:pointer;margin-top:8px}
    .detail-wrap{padding:calc(max(env(safe-area-inset-top),20px) + 20px) 20px 80px}
    .detail-header{display:flex;align-items:flex-start;gap:12px;margin-bottom:20px}
    .detail-info{flex:1}
    .detail-name{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:1px;color:var(--text);line-height:1.1}
    .detail-meta{font-size:12px;color:var(--muted);margin-top:4px}
    .detail-stars{font-size:20px;margin:8px 0}
    .section{margin-bottom:20px}
    .sec-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
    .note-box{background:var(--smoke);border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.6;color:var(--text)}
    .ing-table{width:100%;border-collapse:collapse}
    .ing-table td{padding:6px 0;font-size:14px;border-bottom:1px solid var(--border);background:transparent}
    .ing-table td:first-child{color:var(--accent);font-weight:700;width:36px;font-size:16px}
    .ing-table td:nth-child(2){color:var(--muted);width:54px;font-size:12px;padding-left:6px}
    .action-row{display:flex;gap:10px;margin-top:24px}
    .edit-btn{flex:1;padding:12px;border-radius:10px;background:var(--smoke);border:1px solid var(--border);color:var(--text);font-size:14px;font-weight:500;cursor:pointer;width:auto}
    .del-btn{padding:12px 16px;border-radius:10px;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:#ef4444;font-size:14px;cursor:pointer;width:auto}
    .dup-btn{padding:12px 14px;border-radius:10px;background:rgba(232,160,32,0.1);border:1px solid rgba(232,160,32,0.3);color:var(--accent);font-size:13px;font-weight:500;cursor:pointer;width:auto;white-space:nowrap}
    /* Auth-Screen */
    .auth-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;padding:40px 24px;gap:20px;background:linear-gradient(180deg,#161411 0%,var(--bg) 100%)}
    .auth-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px 28px;max-width:380px;width:100%;box-shadow:0 8px 32px rgba(0,0,0,0.4)}
    .auth-logo{font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:3px;color:var(--accent);text-align:center;line-height:1}
    .auth-sub{font-size:11px;color:var(--muted);text-align:center;letter-spacing:1px;text-transform:uppercase;margin-top:4px;margin-bottom:24px}
    .auth-title{font-size:16px;color:var(--text);margin-bottom:18px;text-align:center;font-weight:500}
    .auth-field{margin-bottom:14px}
    .auth-field label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;display:block}
    .auth-error{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:#ef4444;padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:14px;line-height:1.4}
    .auth-info{background:rgba(232,160,32,0.1);border:1px solid rgba(232,160,32,0.3);color:var(--accent);padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:14px;line-height:1.4}
    .auth-submit{width:100%;padding:14px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:2px;cursor:pointer;margin-top:4px}
    .auth-submit:disabled{opacity:0.5;cursor:wait}
    .auth-toggle{text-align:center;margin-top:18px;font-size:13px;color:var(--muted)}
    .auth-toggle a{color:var(--accent);cursor:pointer;text-decoration:underline}
    .auth-version{text-align:center;font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
    /* User/Logout Footer */
    .sidebar-user{font-size:10px;color:var(--text);margin-top:10px;text-align:center;word-break:break-all;padding:0 4px}
    .sidebar-user-admin{color:var(--accent);font-weight:600}
    .sidebar-logout-btn{background:transparent;border:1px solid var(--border);color:var(--muted);font-size:10px;padding:5px 12px;border-radius:6px;margin-top:8px;cursor:pointer;letter-spacing:1px;text-transform:uppercase;transition:color 0.15s,border-color 0.15s}
    .sidebar-logout-btn:hover{color:#ef4444;border-color:#ef4444}
    .sidebar-admin-link{display:block;font-size:10px;color:var(--accent);margin-top:10px;text-decoration:none;text-align:center;padding:6px;border:1px dashed rgba(232,160,32,0.4);border-radius:6px;letter-spacing:0.5px}
    .sidebar-admin-link:hover{background:rgba(232,160,32,0.08)}
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:100;display:flex;align-items:flex-end}
    .sheet{background:var(--surface);border-radius:20px 20px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px));width:100%;border-top:1px solid var(--border)}
    .sheet-title{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--accent);letter-spacing:1px;margin-bottom:12px}
    .sheet-ta{width:100%;height:140px;font-size:16px;resize:none;font-family:monospace}
    .sheet-btns{display:flex;gap:8px;margin-top:12px}
    .sheet-ok{flex:1;padding:14px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:1px;cursor:pointer;width:auto}
    .sheet-cancel{padding:14px 16px;border-radius:10px;background:var(--smoke);border:1px solid var(--border);color:var(--muted);font-size:14px;cursor:pointer;width:auto}
    .sidebar{display:none}
    .desktop-list-header{display:none}
    .search-wrap{position:relative;display:flex;align-items:center;flex:1}
    .search-input{background:var(--smoke);border:1px solid var(--border);border-radius:10px;padding:9px 34px 9px 36px;color:var(--text);font-size:16px;width:100%;outline:none;font-family:'DM Sans',sans-serif}
    .search-input:focus{border-color:var(--accent)}
    .search-input::placeholder{color:var(--muted)}
    .search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none}
    .search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;background:var(--border);color:var(--text);font-size:14px;line-height:20px;text-align:center;cursor:pointer;transition:background 0.15s,color 0.15s;user-select:none}
    .search-clear:hover{background:var(--accent);color:#fff}
    .mobile-search-wrap{padding:10px 20px 4px}
    .card-img{width:calc(100% + 32px);height:120px;object-fit:cover;border-radius:10px 10px 0 0;margin:-16px -16px 12px;display:block}
    .detail-photo{width:100%;max-height:260px;object-fit:cover;border-radius:10px;margin-bottom:16px;display:block}
    .photo-pick{border:2px dashed var(--border);border-radius:10px;padding:20px;text-align:center;color:var(--muted);font-size:14px;cursor:pointer;margin-bottom:16px;line-height:1.8}
    .photo-preview{width:100%;max-height:200px;object-fit:cover;border-radius:10px;margin-bottom:6px;cursor:pointer;display:block}
    .photo-rm{background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;padding:0 0 12px;display:block}
    .tag-pill{display:inline-flex;align-items:center;padding:4px 11px;border-radius:20px;font-size:12px;font-weight:500;border:1px solid var(--border);background:var(--smoke);color:var(--muted);cursor:pointer;white-space:nowrap;transition:background 0.15s,color 0.15s,border-color 0.15s;-webkit-user-select:none;user-select:none}
    .tag-pill.active{background:rgba(232,160,32,0.15);color:var(--accent);border-color:rgba(232,160,32,0.5)}
    .tag-pill.type-active{background:var(--accent);color:#fff;border-color:var(--accent)}
    .tag-group{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
    .tag-group-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px}
    .mobile-filter-wrap{padding:4px 20px 8px;display:flex;flex-direction:column;gap:8px}
    .mobile-filter-row{display:flex;flex-direction:column;gap:4px}
    .mobile-filter-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
    .mobile-filter-pills{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
    .mobile-filter-stars{display:flex;align-items:center;gap:2px}
    .card-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:5px}
    .card-type-pill{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600;background:rgba(232,160,32,0.12);color:var(--accent);border:1px solid rgba(232,160,32,0.3)}
    .card-meat-pill{font-size:10px;padding:2px 8px;border-radius:20px;background:var(--smoke);color:var(--muted);border:1px solid var(--border)}
    .card-check{position:absolute;top:10px;right:10px;width:24px;height:24px;border-radius:50%;border:2px solid var(--border);background:var(--smoke);display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;z-index:5;transition:opacity 0.15s,background 0.15s,border-color 0.15s;flex-shrink:0;opacity:0;pointer-events:none}
    .card-check.checked{background:var(--accent);border-color:var(--accent)}
    .selecting .card-check{opacity:1;pointer-events:auto}
    .entry-card.selected{border-color:var(--accent);background:rgba(232,160,32,0.06)}
    .selection-bar{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;z-index:60;box-shadow:0 -4px 20px rgba(0,0,0,0.3)}
    .sel-cancel{padding:12px 16px;border-radius:10px;background:var(--smoke);border:1px solid var(--border);color:var(--muted);font-size:14px;cursor:pointer;flex-shrink:0;width:auto}

    /* ===== Design "Glut" v3.1 (22.11.2026) — nur Optik, ueberschreibt die Regeln oben.
       Zum Zuruecknehmen diesen Block bis "Ende Glut" loeschen. ===== */
    :root{--bg:#0b0a08;--surface:rgba(30,26,21,0.62);--surface-solid:#17140f;--border:rgba(255,190,110,0.10);--border-hi:rgba(255,190,110,0.22);--smoke:rgba(255,235,205,0.05);--muted:#8f8676;--glow:rgba(232,160,32,0.35);--ember:#ff7a1a}

    body{background:transparent;min-height:100dvh}
    body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:
      radial-gradient(900px 520px at 85% -10%,rgba(232,120,32,0.20),transparent 60%),
      radial-gradient(700px 480px at -10% 110%,rgba(196,92,26,0.16),transparent 60%),
      radial-gradient(500px 300px at 50% 120%,rgba(255,170,60,0.07),transparent 70%)}
    .logo span{-webkit-text-fill-color:#9a8f7c;color:#9a8f7c}
    ::selection{background:rgba(232,160,32,0.35)}

    .header{background:linear-gradient(180deg,rgba(11,10,8,0.92),rgba(11,10,8,0.72));-webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%);border-bottom:1px solid var(--border)}
    .badge,.menu-btn{background:rgba(255,235,205,0.06);border-color:var(--border-hi);color:#c9bfae}
    .dropdown,.sidebar-dropdown{background:rgba(24,21,17,0.92);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-color:var(--border-hi);box-shadow:0 18px 48px rgba(0,0,0,0.55)}
    /* Karten: Glas mit warmem Lichtrand */
    .entry-card{background:linear-gradient(180deg,rgba(255,220,170,0.055),rgba(255,220,170,0.015)),var(--surface);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:18px;box-shadow:inset 0 1px 0 rgba(255,230,190,0.07),0 10px 30px rgba(0,0,0,0.35)}

    .fab{color:#1a0f04;box-shadow:0 8px 30px rgba(232,130,32,0.55),0 0 0 6px rgba(232,160,32,0.10),inset 0 1px 0 rgba(255,240,200,0.6)}
    .fab:active,.save-btn:active,.auth-submit:active,.sidebar-new-btn:active{transform:scale(0.97)}
    .back-btn,.edit-btn,.sheet-cancel,.sel-cancel{background:rgba(255,235,205,0.06);border-color:var(--border-hi)}

    /* --- Glut Stufe 2: Markencharakter --- */

let _toastEl=null,_toastTimer=null;
function toast(msg,ms){
  if(!_toastEl){_toastEl=document.createElement("div");_toastEl.className="toast";document.body.appendChild(_toastEl);}

// Sync-Zustand. supabase-js wirft bei DB-/RLS-Fehlern nicht, es liefert nur
// {error}. Ohne Auswertung galt "Sync OK", obwohl nichts gespeichert war, und
// der 10s-Poll ueberschrieb den lokalen Stand mit der Cloud.
//   _synced: id -> JSON des zuletzt erfolgreich hochgeladenen Eintrags
//   _syncing: laufende Uploads; _dirty: letzter Upload war fehlerhaft
//   _syncGen: wird bei jeder lokalen Aenderung erhoeht, damit der Poll eine
//             waehrend des Ladens veraltete Antwort verwerfen kann
let _synced=new Map(),_syncing=0,_dirty=false,_syncGen=0,_syncChain=Promise.resolve();
function markSynced(entries){_synced=new Map(entries.map(e=>[e.id,JSON.stringify(e)]));}

function syncToSupabase(entries){
  if(!S.session)return Promise.resolve(); // nicht eingeloggt -> kein Sync
  _syncing++;
  _syncChain=_syncChain.then(()=>doSync(entries)).finally(()=>{_syncing--;});
  return _syncChain;
}
async function doSync(entries){
  if(!S.session)return;
  const db=getSB(),uid=S.session.user.id;
  // Nur geaenderte Eintraege hochladen (statt jedes Mal alle).
  const changed=entries.filter(e=>_synced.get(e.id)!==JSON.stringify(e));
  let failed=0;
  for(const entry of changed){
    try{
      const {error}=await db.from("entries").upsert({id:entry.id, data:entry, user_id:uid, updated_at:new Date().toISOString()});
      if(error) throw error;
      _synced.set(entry.id,JSON.stringify(entry));
    }catch(e){failed++;console.error("Sync error:",e);}
  }
  if(failed){
    if(!_dirty) toast("Speichern in der Cloud fehlgeschlagen. Deine Änderung liegt nur auf diesem Gerät, die App versucht es automatisch erneut.");
    _dirty=true;
  }else _dirty=false;
}

// passive=true: nur laden, nichts lokal ueberschreiben (Poll prueft erst, ob
// die Antwort noch aktuell ist).
async function loadFromSupabase(passive){
  if(!S.session)return null;
  try{
    const db = getSB();
    const uid = S.session.user.id;
    const {data, error} = await db.from("entries").select("*").eq("user_id", uid).order("updated_at", {ascending:false});
    if(error) throw error;
    if(data){
      const entries = data.map(r => r.data);
      if(!passive){
        localStorage.setItem(KEY, JSON.stringify(entries));
        markSynced(entries);
      }
      return entries;
    }
  }catch(e){console.error("Load error:",e);}
  return null;
}

async function doSignIn(){
  const em=(S.authEmail||"").trim().toLowerCase();const pw=S.authPass||"";
  if(!em||!pw){set({authError:"Email und Passwort eingeben"});return;}
  set({authLoading:true,authError:null});
  try{
    const db=getSB();
    const {data,error}=await db.auth.signInWithPassword({email:em,password:pw});
    if(error)throw error;
    S.session=data.session;S.authPass="";S.authEmail="";

async function doSignUp(){
  const em=(S.authEmail||"").trim().toLowerCase();const pw=S.authPass||"";
  if(!em||!pw){set({authError:"Email und Passwort eingeben"});return;}
  if(pw.length<6){set({authError:"Passwort min. 6 Zeichen"});return;}
  set({authLoading:true,authError:null});
  try{
    const db=getSB();
    const {data,error}=await db.auth.signUp({email:em,password:pw});
    if(error)throw error;
    if(data.session){
      S.session=data.session;S.authPass="";S.authEmail="";
      const cloud=await loadFromSupabase();
      S.entries=cloud||load();
      set({view:"list",authLoading:false,authError:null,authMode:"login"});
      if(!cloud) toast("Die Rezepte konnten nicht aus der Cloud geladen werden. Angezeigt wird der lokale Stand.");
    }else{
      set({authLoading:false,authInfo:"Account erstellt! Bitte einloggen.",authMode:"login",authPass:""});
    }
  }catch(e){
    console.error("SignUp-Fehler:",e);
    set({authLoading:false,authError:e?.message||"Registrierung fehlgeschlagen"});
  }
}

const _FR={"¼":0.25,"½":0.5,"¾":0.75,"⅓":1/3,"⅔":2/3,"⅛":0.125};
function parseQty(q){
  if(!q)return NaN;q=String(q).trim().replace(",",".");
  let m=q.match(/^(\d+(?:\.\d+)?)?\s*([¼½¾⅓⅔⅛])?$/);
  if(m&&(m[1]||m[2]))return (m[1]?parseFloat(m[1]):0)+(m[2]?_FR[m[2]]:0);
  m=q.match(/^(\d+)\/(\d+)$/);if(m)return m[1]/m[2];
  return NaN;
}
// Grobe Umrechnung auf Teeloeffel, nur fuer den Anteil-Balken (Gramm wie ml gerechnet)
const _UNIT_TL={"TL":1,"EL":3,"Cup":48,"Prise":0.0625,"ml":0.2,"g":0.2,"L":200};
function fmtQty(n){
  if(!isFinite(n)||n<=0)return "";
  const w=Math.floor(n),f=n-w;
  const F=[[0,""],[0.125,"⅛"],[0.25,"¼"],[1/3,"⅓"],[0.5,"½"],[2/3,"⅔"],[0.75,"¾"],[1,""]];
  if(n<10){let best=F[0];for(const x of F)if(Math.abs(f-x[0])<Math.abs(f-best[0]))best=x;
    if(Math.abs(f-best[0])<0.05){const ww=best[0]===1?w+1:w;return (ww?String(ww):"")+best[1]||"0";}}
  return String(Math.round(n*10)/10).replace(".",",");
}
function scaledQty(q,k){if(k===1)return q||"";const v=parseQty(q);return isNaN(v)?(q||""):fmtQty(v*k);}
function normName(n){return (n||"").trim().toLowerCase();}
function versionsOf(e){
  return S.entries.filter(x=>normName(x.name)===normName(e.name)).sort((a,b)=>(parseFloat(a.version)||0)-(parseFloat(b.version)||0)||String(a.date).localeCompare(String(b.date)));
}
function diffIngs(prev,cur){
  const key=i=>normName(i.name);const P=new Map((prev.ingredients||[]).filter(i=>i.name).map(i=>[key(i),i]));const C=new Map((cur.ingredients||[]).filter(i=>i.name).map(i=>[key(i),i]));
  const out=[];
  C.forEach((i,k)=>{const p=P.get(k);if(!p)out.push({t:"add",i});else if((p.qty||"")!==(i.qty||"")||(p.unit||"")!==(i.unit||""))out.push({t:"chg",i,p});});
  P.forEach((i,k)=>{if(!C.has(k))out.push({t:"del",i});});
  return out;
}
function mixShares(ings){
  const rows=ings.map(i=>{const q=parseQty(i.qty),f=_UNIT_TL[i.unit];return(isNaN(q)||!f)?null:q*f;});
  const ok=rows.filter(x=>x!==null&&x>0);
  if(ok.length<2)return null;
  const tot=ok.reduce((a,b)=>a+b,0);
  return rows.map(x=>x===null?null:x/tot);
}

  tRow.appendChild(tPills);mfw.appendChild(tRow);

  aRow.appendChild(aPills);mfw.appendChild(aRow);

  // Import overlay

  // List

    em.appendChild(icon);em.appendChild(h3);em.appendChild(p);em.appendChild(btn("empty-cta","+ ERSTE MISCHUNG",openNew));

  filtered.forEach(e=>{
    const card=div("entry-card"+(S.selectionMode&&S.selectedIds.includes(e.id)?" selected":""));
    card.style.setProperty("--st-color",SC[e.status]);
    card.addEventListener("click",()=>{
      if(S.selectionMode){
        const ids=S.selectedIds.includes(e.id)?S.selectedIds.filter(x=>x!==e.id):[...S.selectedIds,e.id];
        set({selectedIds:ids});
      }else{set({view:"detail",detailId:e.id});}
    });
    card.addEventListener("touchstart",()=>{
      _lpTimer=setTimeout(()=>{_lpTimer=null;set({selectionMode:true,selectedIds:[e.id]});},500);
    },{passive:true});
    card.addEventListener("touchmove",()=>{if(_lpTimer){clearTimeout(_lpTimer);_lpTimer=null;}},{passive:true});
    card.addEventListener("touchend",()=>{if(_lpTimer){clearTimeout(_lpTimer);_lpTimer=null;}},{passive:true});
    const media=div("card-media");
    if(e.photoUrl){const ci=document.createElement("img");ci.className="card-img";ci.src=e.photoUrl;ci.alt=e.name;ci.loading="lazy";ci.addEventListener("error",()=>ci.replaceWith(placeholder(e,"card-ph")));media.appendChild(ci);}
    else media.appendChild(placeholder(e,"card-ph"));
    card.appendChild(media);
    const ck=div("card-check"+(S.selectedIds.includes(e.id)?" checked":""));
    ck.textContent=S.selectedIds.includes(e.id)?"✓":"";
    ck.addEventListener("click",ev=>{ev.stopPropagation();const ids=S.selectedIds.includes(e.id)?S.selectedIds.filter(x=>x!==e.id):[...S.selectedIds,e.id];set({selectionMode:true,selectedIds:ids});});
    card.appendChild(ck);

    const pill=div("status-pill");

    pill.classList.add("on-media");media.appendChild(pill);
    ctop.appendChild(nd);card.appendChild(ctop);
    if(e.type||(e.meats&&e.meats.length>0)){
      const ct=div("card-tags");
      if(e.type){const tp=div("card-type-pill");tp.textContent=e.type;ct.appendChild(tp);}
      (e.meats||[]).forEach(m=>{const mp=div("card-meat-pill");mp.textContent=m;ct.appendChild(mp);});
      card.appendChild(ct);
    }
    const st=div("stars");[1,2,3,4,5].forEach(n=>{const s=document.createElement("span");s.textContent="★";s.style.color=n<=e.rating?"var(--accent)":"rgba(255,235,205,0.16)";st.appendChild(s);});card.appendChild(st);
    const cnt=(e.ingredients||[]).filter(i=>i.name).length;
    const ic=div("ing-count");ic.textContent=cnt+" Zutaten";card.appendChild(ic);
    if(e.notizen){const cn2=div("card-note");cn2.textContent=e.notizen;card.appendChild(cn2);}
    list.appendChild(card);
  });
  main.appendChild(list);
  if(S.selectionMode){
    const bar=div("selection-bar");
    const cancelB=btn("sel-cancel","Abbrechen",()=>set({selectionMode:false,selectedIds:[]}));
    const n=S.selectedIds.length;
    const exportB=btn("sel-export",n===0?"Auswählen...":n+" Rezept"+(n===1?"":"e")+" exportieren",async()=>{
      if(n===0)return;
      const sel=S.entries.filter(x=>S.selectedIds.includes(x.id));
      await doExport(sel);
      set({selectionMode:false,selectedIds:[]});
    });
    if(n===0)exportB.disabled=true;
    bar.appendChild(cancelB);bar.appendChild(exportB);
    wrap.appendChild(bar);
  }
  wrap.appendChild(main);
  wrap.appendChild(btn("fab","+",openNew));

function renderForm(){
  const c=S.current;
  const wrap=div("form-wrap");
  const fh=div("form-header");
  fh.appendChild(btn("back-btn","\u2190",()=>set({view:"list"})));
  const ft=div("form-title");
  ft.textContent=S.entries.find(e=>e.id===c.id)?"Rezept bearbeiten":"Neues Rezept";
  fh.appendChild(ft);wrap.appendChild(fh);

  // Name + Version
  const nf=div("field");
  const nl=document.createElement("label");nl.className="lbl";nl.textContent="Name der Mischung";
  const nr=div("name-row");
  const ni=inp("",c.name,e=>{S.current=Object.assign({},S.current,{name:e.target.value});},{placeholder:"Gib einen Gew\u00fcrz Namen ein..."});
  const vb=div("ver-badge");
  const vt=document.createTextNode("V.");
  const vi=inp("",c.version||"",e=>{S.current=Object.assign({},S.current,{version:e.target.value});},{placeholder:"1",inputMode:"numeric"});
  vb.appendChild(vt);vb.appendChild(vi);
  nr.appendChild(ni);nr.appendChild(vb);
  nf.appendChild(nl);nf.appendChild(nr);wrap.appendChild(nf);

  // Photo
  const phf=div("field");
  const phl=document.createElement("label");phl.className="lbl";phl.textContent="Foto";
  const phi=document.createElement("input");phi.type="file";phi.accept="image/*";phi.style.display="none";
  phi.addEventListener("change",ev=>{if(ev.target.files&&ev.target.files[0]){S.pendingPhoto=ev.target.files[0];render();}});
  phf.appendChild(phl);
  const previewSrc=S.pendingPhoto?URL.createObjectURL(S.pendingPhoto):(c.photoUrl||"");
  if(previewSrc){
    const pimg=document.createElement("img");pimg.className="photo-preview";pimg.src=previewSrc;pimg.alt="Foto";
    pimg.addEventListener("click",()=>phi.click());
    phf.appendChild(pimg);
    const prm=document.createElement("button");prm.className="photo-rm";prm.textContent="✕ Foto entfernen";
    prm.addEventListener("click",()=>{S.pendingPhoto=null;S.current=Object.assign({},S.current,{photoUrl:""});render();});
    phf.appendChild(prm);
  }else{
    const ppick=div("photo-pick");const pp1=div("pp-icon");pp1.textContent="+";const pp2=div("pp-txt");pp2.textContent="Foto aufnehmen oder wählen";ppick.appendChild(pp1);ppick.appendChild(pp2);
    ppick.addEventListener("click",()=>phi.click());
    phf.appendChild(ppick);
  }
  phf.appendChild(phi);wrap.appendChild(phf);

  // Date
  const df=div("field");
  const dl=document.createElement("label");dl.className="lbl";dl.textContent="Datum";
  const di=inp("",c.date,e=>{S.current=Object.assign({},S.current,{date:e.target.value});},{type:"date"});
  df.appendChild(dl);df.appendChild(di);wrap.appendChild(df);

  // Rating
  const rf=div("field");
  const rl=document.createElement("label");rl.className="lbl";rl.textContent="Bewertung";
  const sr=div("stars-input");
  for(let s=1;s<=5;s++){
    const b=document.createElement("button");b.className="star-btn";
    b.textContent="\u2605";b.style.color=s<=c.rating?"var(--accent)":"var(--muted)";
    b.addEventListener("click",()=>{
      S.current=Object.assign({},S.current,{rating:s});
      [...sr.children].forEach((btn,i)=>{btn.style.color=(i+1)<=s?"var(--accent)":"var(--muted)";});
    });
    sr.appendChild(b);
  }
  rf.appendChild(rl);rf.appendChild(sr);wrap.appendChild(rf);

  // Status
  const sf=div("field");
  const sl=document.createElement("label");sl.className="lbl";sl.textContent="Status";
  const sel=div("seg");
  ["in Arbeit","fertig","verworfen"].forEach(o=>{
    const b=document.createElement("button");b.type="button";b.className="seg-btn"+(o===c.status?" on":"");b.textContent=SI[o]+" "+o;
    b.style.setProperty("--sc",SC[o]);
    b.addEventListener("click",()=>{S.current=Object.assign({},S.current,{status:o});sel.querySelectorAll(".seg-btn").forEach(x=>x.classList.toggle("on",x===b));});
    sel.appendChild(b);
  });
  sf.appendChild(sl);sf.appendChild(sel);wrap.appendChild(sf);

  // Typ
  const tf=div("field");
  const tl=document.createElement("label");tl.className="lbl";tl.textContent="Typ";
  const tg=div("tag-group");
  TYPES.forEach(t=>{
    const p=div("tag-pill"+(c.type===t?" type-active":""));p.textContent=t;
    p.addEventListener("click",()=>{
      S.current=Object.assign({},S.current,{type:S.current.type===t?"":t});
      tg.querySelectorAll(".tag-pill").forEach(pill=>pill.classList.toggle("type-active",pill.textContent===S.current.type));
    });
    tg.appendChild(p);
  });
  tf.appendChild(tl);tf.appendChild(tg);wrap.appendChild(tf);

  // Anwendung (Fleisch-Tags)
  const mf=div("field");
  const ml=document.createElement("label");ml.className="lbl";ml.textContent="Anwendung";
  const mg=div("tag-group");
  MEATS.forEach(m=>{
    const ms=c.meats||[];const isOn=ms.includes(m);
    const p=div("tag-pill"+(isOn?" active":""));p.textContent=m;
    p.addEventListener("click",()=>{
      const cur=S.current.meats||[];
      const next=cur.includes(m)?cur.filter(x=>x!==m):[...cur,m];
      S.current=Object.assign({},S.current,{meats:next});
      p.classList.toggle("active",S.current.meats.includes(m));
    });
    mg.appendChild(p);
  });
  mf.appendChild(ml);mf.appendChild(mg);wrap.appendChild(mf);

  // Ingredients
  const ib=div("ing-block");
  const it=div("ing-title");it.textContent="Zutaten";ib.appendChild(it);
  const fl=div("frac-lbl");fl.textContent="Schnelleingabe Menge";ib.appendChild(fl);
  const fr=div("frac-row");
  FRACS.forEach(f=>{
    const b=document.createElement("button");b.className="frac-btn";b.textContent=f;
    b.addEventListener("click",()=>{
      const ings=S.current.ingredients.map((x,i)=>i===S.focusedIng?Object.assign({},x,{qty:f}):x);
      set({current:Object.assign({},S.current,{ingredients:ings})});
    });
    fr.appendChild(b);
  });
  ib.appendChild(fr);

  const cl=div("col-labels");
  const cq=div("col-lbl qty");cq.textContent="Menge";
  const cu=div("col-lbl unit");cu.textContent="Einheit";
  const cn=div("col-lbl name");cn.textContent="Gew\u00fcrz";
  cl.appendChild(cq);cl.appendChild(cu);cl.appendChild(cn);ib.appendChild(cl);

  c.ingredients.forEach((ing,i)=>{
    const row=div("ing-row");
    const qi=inp("ing-qty",ing.qty||"",e=>{
      const ings=S.current.ingredients.map((x,j)=>j===i?Object.assign({},x,{qty:e.target.value}):x);
      S.current=Object.assign({},S.current,{ingredients:ings});
    },{placeholder:"\u00bd"});
    qi.addEventListener("focus",()=>{S.focusedIng=i;});

    const us=document.createElement("select");us.className="ing-unit";
    UNITS.forEach(u=>{
      const op=document.createElement("option");op.value=u;op.textContent=u;
      if(u===(ing.unit||"TL"))op.selected=true;us.appendChild(op);
    });
    us.addEventListener("change",e=>{
      const ings=S.current.ingredients.map((x,j)=>j===i?Object.assign({},x,{unit:e.target.value}):x);
      S.current=Object.assign({},S.current,{ingredients:ings});
    });

    const ni2=inp("ing-name",ing.name||"",e=>{
      const ings=S.current.ingredients.map((x,j)=>j===i?Object.assign({},x,{name:e.target.value}):x);
      S.current=Object.assign({},S.current,{ingredients:ings});
    },{placeholder:"Rosmarin..."});

    const db=document.createElement("button");db.className="ing-del";db.textContent="\u2715";
    db.addEventListener("click",()=>set({current:Object.assign({},S.current,{ingredients:S.current.ingredients.filter((_,j)=>j!==i)})}));
    row.appendChild(qi);row.appendChild(us);row.appendChild(ni2);row.appendChild(db);ib.appendChild(row);
  });

  const ab=document.createElement("button");ab.className="add-ing";ab.textContent="+ Zutat hinzuf\u00fcgen";
  ab.addEventListener("click",()=>set({current:Object.assign({},S.current,{ingredients:[...S.current.ingredients,{qty:"",unit:"TL",name:""}]})}));
  ib.appendChild(ab);wrap.appendChild(ib);

  // Notizen
  const nzf=div("field");
  const nzl=document.createElement("label");nzl.className="lbl";nzl.textContent="Notizen & Geschmack";
  const ta=document.createElement("textarea");ta.value=c.notizen;
  ta.placeholder="Zu salzig? Mehr Zitrone? Was w\u00fcrdest du \u00e4ndern?";
  ta.addEventListener("input",e=>{S.current=Object.assign({},S.current,{notizen:e.target.value});});
  nzf.appendChild(nzl);nzf.appendChild(ta);wrap.appendChild(nzf);
  // In Gruppen-Karten ordnen (nur Optik)
  const grp=(title,nodes)=>{const g=div("form-group");if(title){const h=div("form-group-title");h.textContent=title;g.appendChild(h);}nodes.forEach(n=>g.appendChild(n));wrap.appendChild(g);};
  [nf,phf,df,rf,sf,tf,mf,ib,nzf].forEach(n=>n.remove());
  grp("Die Mischung",[nf,phf]);
  grp("Bewertung & Stand",[rf,sf,df]);
  grp("Einordnung",[tf,mf]);
  wrap.appendChild(ib);
  grp("",[nzf]);
  const sb=div("save-bar");sb.appendChild(btn("save-btn","SPEICHERN",doSave));wrap.appendChild(sb);
  return wrap;
}

function renderDetail(){
  const entry=S.entries.find(e=>e.id===S.detailId);
  if(!entry)return div("");
  const wrap=div("detail-wrap");
  const hero=div("detail-hero");
  if(entry.photoUrl){const pi=document.createElement("img");pi.className="detail-photo";pi.src=entry.photoUrl;pi.alt=entry.name;pi.addEventListener("error",()=>pi.replaceWith(placeholder(entry,"detail-ph")));hero.appendChild(pi);}
  else hero.appendChild(placeholder(entry,"detail-ph"));
  hero.appendChild(btn("back-btn hero-back","\u2190",()=>set({view:"list"})));
  wrap.appendChild(hero);
  const dh=div("detail-header");
  const di=div("detail-info");
  const dn=div("detail-name");nameWithVer(dn,entry);
  const dm=div("detail-meta");dm.textContent=entry.date;
  const ds=div("detail-stars");
  [1,2,3,4,5].forEach(n=>{
    const s=document.createElement("span");s.textContent="★";
    s.style.cssText="cursor:pointer;color:"+(n<=entry.rating?"var(--accent)":"var(--muted)")+";transition:color 0.15s,transform 0.1s;-webkit-user-select:none;user-select:none;padding:0 2px";
    s.title="Bewertung auf "+n+" Sterne setzen";
    s.addEventListener("click",()=>{
      const newRating=entry.rating===n?0:n; // nochmal auf gleichen Stern → reset auf 0
      entry.rating=newRating;
      S.entries=S.entries.map(x=>x.id===entry.id?entry:x);
      // DOM-Update ohne Re-Render (kein Flicker)
      [...ds.children].forEach((star,i)=>{star.style.color=(i+1)<=newRating?"var(--accent)":"var(--muted)";});
      // Klick-Animation
      s.style.transform="scale(1.3)";
      setTimeout(()=>{s.style.transform="scale(1)";},120);
      // Persistieren (localStorage + Supabase async)
      save(S.entries);
    });
    ds.appendChild(s);
  });
  const pill=div("status-pill");
  pill.textContent=SI[entry.status]+" "+entry.status;
  pill.style.cssText="display:inline-block;background:"+SC[entry.status]+"22;color:"+SC[entry.status]+";border:1px solid "+SC[entry.status]+"44;font-size:12px;padding:3px 10px;border-radius:20px";
  di.appendChild(dn);di.appendChild(dm);di.appendChild(ds);di.appendChild(pill);
  if(entry.type||(entry.meats&&entry.meats.length>0)){
    const dt=div("card-tags");dt.style.marginTop="8px";
    if(entry.type){const tp=div("card-type-pill");tp.textContent=entry.type;dt.appendChild(tp);}
    (entry.meats||[]).forEach(m=>{const mp=div("card-meat-pill");mp.textContent=m;dt.appendChild(mp);});
    di.appendChild(dt);
  }
  dh.appendChild(di);wrap.appendChild(dh);
  // Versionen derselben Mischung + Unterschiede zur Vorversion
  const vers=versionsOf(entry);
  if(vers.length>1){
    const vs=div("section ver-section");
    const vl=div("sec-lbl");vl.textContent="Versionen";vs.appendChild(vl);
    const tl=div("ver-line");
    vers.forEach(v=>{
      const c=div("ver-node"+(v.id===entry.id?" current":""));
      const vv=div("ver-node-v");vv.textContent="V."+(v.version||"?");
      const vr=div("ver-node-r");vr.textContent=v.rating?("★".repeat(v.rating)):"–";
      c.appendChild(vv);c.appendChild(vr);c.style.setProperty("--st-color",SC[v.status]);
      if(v.id!==entry.id)c.addEventListener("click",()=>set({detailId:v.id}));
      tl.appendChild(c);
    });
    vs.appendChild(tl);
    const idx=vers.findIndex(v=>v.id===entry.id);
    if(idx>0){
      const prev=vers[idx-1];const d=diffIngs(prev,entry);
      const box=div("diff-box");
      const h=div("diff-head");h.textContent="Was ist neu gegenüber V."+(prev.version||"?");box.appendChild(h);
      if(!d.length){const n=div("diff-row same");n.textContent="Zutaten unverändert";box.appendChild(n);}
      d.forEach(x=>{
        const r=div("diff-row "+x.t);
        const sym=document.createElement("span");sym.className="diff-sym";sym.textContent=x.t==="add"?"+":x.t==="del"?"−":"↻";
        const tx=document.createElement("span");
        if(x.t==="chg")tx.textContent=x.i.name+": "+(x.p.qty||"")+" "+(x.p.unit||"")+" → "+(x.i.qty||"")+" "+(x.i.unit||"");
        else tx.textContent=x.i.name+" ("+(x.i.qty||"")+" "+(x.i.unit||"")+")";
        r.appendChild(sym);r.appendChild(tx);box.appendChild(r);
      });
      if((prev.rating||0)!==(entry.rating||0)){const r=div("diff-row rate");r.textContent="Bewertung "+(prev.rating||0)+"★ → "+(entry.rating||0)+"★";box.appendChild(r);}
      vs.appendChild(box);
    }
    wrap.appendChild(vs);
  }

  const is=div("section");
  if(S.scaleFor!==entry.id){S.scale=1;S.scaleFor=entry.id;}
  const k=S.scale;
  const ish=div("ing-head");
  const isl=div("sec-lbl");isl.textContent="Zutaten";ish.appendChild(isl);
  const sc=div("scale-row");
  [[0.5,"½×"],[1,"1×"],[2,"2×"],[3,"3×"]].forEach(([f,l])=>{const b=btn("scale-btn"+(k===f?" on":""),l,()=>set({scale:f}));b.title="Mengen "+l+" umrechnen";sc.appendChild(b);});
  ish.appendChild(sc);is.appendChild(ish);
  if(k!==1){const hn=div("scale-note");hn.textContent="Mengen auf "+String(k).replace(".",",")+"× umgerechnet – gespeichert bleibt das Original.";is.appendChild(hn);}
  const nb=div("note-box");
  const tbl=document.createElement("table");tbl.className="ing-table";
  const tb=document.createElement("tbody");
  const _ings=(entry.ingredients||[]).filter(i=>i.name);
  const _sh=mixShares(_ings);
  const _pal=["#ffc14a","#e4572e","#f2e1bb","#b5651d","#f08a24","#8c2f1a","#d9b44a","#6b3e26","#ff9e6b","#a0522d"];
  if(_sh){
    const mix=div("mix-bar");
    _ings.forEach((ing,i)=>{if(!_sh[i])return;const seg=div("mix-seg");seg.style.flex=String(_sh[i]);seg.style.background=_pal[i%_pal.length];seg.title=ing.name+" "+Math.round(_sh[i]*100)+" %";mix.appendChild(seg);});
    const mt=div("mix-title");mt.textContent="Mischungsverhältnis (ca.)";
    is.appendChild(mt);is.appendChild(mix);
  }
  _ings.forEach((ing,i)=>{
    const tr=document.createElement("tr");
    const td1=document.createElement("td");td1.textContent=scaledQty(ing.qty,k);if(k!==1)td1.classList.add("scaled");
    const td2=document.createElement("td");td2.textContent=ing.unit||"";
    const td3=document.createElement("td");td3.textContent=ing.name;
    if(_sh){td3.style.setProperty("--dot",_pal[i%_pal.length]);td3.className="has-dot";}
    const td4=document.createElement("td");td4.className="ing-pct";
    if(_sh&&_sh[i]){td4.textContent=Math.round(_sh[i]*100)+" %";}
    tr.appendChild(td1);tr.appendChild(td2);tr.appendChild(td3);tr.appendChild(td4);tb.appendChild(tr);
  });
  tbl.appendChild(tb);nb.appendChild(tbl);is.appendChild(nb);wrap.appendChild(is);

  if(entry.notizen){
    const ns=div("section");
    const nsl=div("sec-lbl");nsl.textContent="Notizen";
    const nb2=div("note-box");nb2.textContent=entry.notizen;
    ns.appendChild(nsl);ns.appendChild(nb2);wrap.appendChild(ns);
  }

  const ar=div("action-row");
  ar.appendChild(btn("edit-btn","Bearbeiten",()=>openEdit(entry)));
  ar.appendChild(btn("dup-btn","＋ Als V."+nextVersion(entry.version),()=>openDuplicate(entry)));
  ar.appendChild(btn("del-btn","Löschen",async()=>{
    if(!confirm("Eintrag wirklich löschen?")) return;
    const id = entry.id;
    const backup = S.entries;
    S.entries=S.entries.filter(e=>e.id!==id);
    _syncGen++;
    localStorage.setItem(KEY,JSON.stringify(S.entries));
    set({view:"list"});
    // Ohne Fehlerauswertung sah geloescht aus, was in der DB noch lag - der
    // 10s-Poll holte den Eintrag danach zurueck. user_id als zweite Absicherung
    // neben RLS.
    let err=null;
    try{
      const uid=S.session&&S.session.user&&S.session.user.id;
      if(!uid) throw new Error("Keine aktive Sitzung");
      const res=await getSB().from("entries").delete().eq("id",id).eq("user_id",uid);
      err=res.error;
    }catch(e){ err=e; }
    if(err){
      console.error("Delete-Fehler:",err);
      S.entries=backup;
      localStorage.setItem(KEY,JSON.stringify(S.entries));
      set({view:"list"});
      toast("Löschen fehlgeschlagen – der Eintrag wurde wiederhergestellt. Prüfe die Verbindung und versuche es erneut.");
    }
  }));
  wrap.appendChild(ar);
  return wrap;
}

function openNew(){
  set({view:"form",focusedIng:0,pendingPhoto:null,current:{id:Date.now(),name:"",version:"",date:new Date().toISOString().split("T")[0],rating:0,anwendung:"",notizen:"",status:"in Arbeit",photoUrl:"",type:"",meats:[],ingredients:[{qty:"",unit:"TL",name:""}]}});
}
function openEdit(e){
  set({view:"form",focusedIng:0,pendingPhoto:null,current:Object.assign({},e,{ingredients:e.ingredients.map(i=>Object.assign({},i))})});
}
function nextVersion(v){const n=parseInt(v,10);return String((isNaN(n)?1:n)+1);}
function openDuplicate(e){
  set({view:"form",focusedIng:0,pendingPhoto:null,current:{
    id:Date.now(),
    name:e.name,
    version:nextVersion(e.version),
    date:new Date().toISOString().split("T")[0],
    rating:0,                                      // neue Version: noch nicht bewertet
    anwendung:e.anwendung||"",                     // legacy
    notizen:"",                                    // frische Notizen
    status:"in Arbeit",                            // neue Iteration startet "in Arbeit"
    photoUrl:"",                                   // neues Foto erwartet
    type:e.type||"",
    meats:[...(e.meats||[])],
    ingredients:(e.ingredients||[]).map(i=>Object.assign({},i))
  }});
}
async function doSave(){
  const c=S.current;if(!c.name.trim())return;
  if(S.pendingPhoto){
    try{c.photoUrl=await uploadPhoto(c.id,S.pendingPhoto);}
    catch(e){
      console.error("Foto-Upload-Fehler:",e,{message:e?.message,status:e?.statusCode||e?.status,name:e?.name,error:e?.error});
      const msg=e?.message||e?.error||"Unbekannter Fehler";
      alert("❌ Foto-Upload fehlgeschlagen:\n\n"+msg+"\n\nDetails in der Browser-Console (F12).");
    }
    S.pendingPhoto=null;
  }
  const ex=S.entries.find(e=>e.id===c.id);
  S.entries=ex?S.entries.map(e=>e.id===c.id?c:e):[c,...S.entries];
  save(S.entries);set({view:"list"});
}
function doDownload(blob,filename){
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;a.click();URL.revokeObjectURL(a.href);
}
async function doExport(entriesToExport){
  const data=Array.isArray(entriesToExport)?entriesToExport:S.entries;
  const filename="bbq-lab-export-"+new Date().toISOString().split("T")[0]+".json";
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const file=new File([blob],filename,{type:"application/json"});
  if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:"BBQ Lab Export"});}
    catch(e){if(e.name!=="AbortError")doDownload(blob,filename);}
  }else{doDownload(blob,filename);}
  set({menuOpen:false,sidebarMenuOpen:false});
}
function doImport(){
  try{
    const d=JSON.parse(S.importText);
    if(!Array.isArray(d))throw 1;
    S.entries=d;save(d);set({importOpen:false,importText:""});
    alert("\u2705 Import erfolgreich!");
  }catch{alert("\u274c Ung\u00fcltiges Format.");}
}

let _lastScreen=null;
function render(){
  const r=document.getElementById("root");
  // Einblend-Animation nur beim Wechsel der Ansicht, nicht bei jedem Tastendruck
  const _scr=S.view+":"+(S.view==="detail"?S.detailId:"");
  r.classList.toggle("enter",_scr!==_lastScreen);
  if(_scr!==_lastScreen){r.classList.remove("enter");void r.offsetWidth;r.classList.add("enter");}
  _lastScreen=_scr;
  const focused=document.activeElement;
  const searchFocused=focused&&focused.classList&&focused.classList.contains("search-input");
  const searchPos=searchFocused?focused.selectionEnd:null;
  r.innerHTML="";
  const isDesktop=window.innerWidth>=768;
  if(S.view==="auth"){
    r.appendChild(renderAuth());
    return;
  }
  if(S.view==="list"){
    r.appendChild(renderList());
  }else if(S.view==="form"){
    if(isDesktop){
      r.appendChild(renderList());
      const ov=div("desktop-modal-overlay");
      const inner=div("desktop-modal-inner");
      inner.appendChild(renderForm());
      ov.appendChild(inner);
      ov.addEventListener("click",e=>{if(e.target===ov)set({view:"list"});});
      r.appendChild(ov);
    }else{r.appendChild(renderForm());}
  }else if(S.view==="detail"){
    if(isDesktop){
      r.appendChild(renderList());
      const ov=div("desktop-modal-overlay");
      const inner=div("desktop-modal-inner");
      inner.appendChild(renderDetail());
      ov.appendChild(inner);
      ov.addEventListener("click",e=>{if(e.target===ov)set({view:"list"});});
      r.appendChild(ov);
    }else{r.appendChild(renderDetail());}
  }
  if(searchFocused){
    const inputs=document.querySelectorAll(".search-input");
    for(const inp of inputs){
      if(inp.offsetParent!==null){
        inp.focus();
        if(searchPos!==null)inp.setSelectionRange(searchPos,searchPos);
        break;
      }
    }
  }
}
// Pull-to-refresh
let ptStart=0, ptEl=null;
function initPTR(){
  ptEl=document.createElement("div");
  ptEl.className="ptr";
  ptEl.innerHTML='<div class="ptr-spinner"></div><span class="ptr-text">Aktualisieren...</span>';
  document.body.prepend(ptEl);

  // Nur in der Liste und nur im Mobile-Layout. Im Formular kostete ein Wisch
  // sonst alle Eingaben; im Desktop-Layout gilt body{overflow:hidden}, dort ist
  // window.scrollY immer 0 und JEDER Abwaertswisch loeste den Reload aus.
  const ptrErlaubt=()=>S.view==="list"&&window.innerWidth<768;

  document.addEventListener("touchstart",e=>{
    if(ptrErlaubt()&&window.scrollY===0) ptStart=e.touches[0].clientY;
  },{passive:true});

  document.addEventListener("touchmove",e=>{
    if(!ptStart) return;
    const dist=e.touches[0].clientY-ptStart;
    if(dist>0 && dist<80){
      ptEl.style.height=dist*0.6+"px";
    }
  },{passive:true});

  document.addEventListener("touchend",async e=>{
    if(!ptStart) return;
    const dist=e.changedTouches[0].clientY-ptStart;
    ptStart=0;
    // Ansicht kann sich waehrend der Geste geaendert haben
    if(!ptrErlaubt()){ ptEl.style.height="0"; return; }
    if(dist>60){
      ptEl.style.height="44px";
      setTimeout(()=>location.reload(),400);
    } else {
      ptEl.style.height="0";
    }
  },{passive:true});
}

(async function init(){
  // Service Worker registrieren (Offline-Support fuer installierte PWA)
  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("./sw.js").catch(e=>console.log("SW reg failed:",e));
  }
  // Session aus Supabase laden (SDK persistiert in localStorage automatisch)
  const db=getSB();
  try{
    const {data:{session}}=await db.auth.getSession();
    S.session=session||null;
  }catch(e){console.error("getSession-Fehler:",e);S.session=null;}

  if(S.session){
    const cloud=await loadFromSupabase();
    S.entries=cloud||load();
    S.view="list";
    if(!cloud) setTimeout(()=>toast("Keine Verbindung zur Cloud. Angezeigt wird der zuletzt gespeicherte Stand auf diesem Gerät."),600);
  }else{
    S.view="auth";S.authMode="login";S.entries=[];
  }
  render();
  initPTR();

  // Auth State Listener — z.B. bei automatischem Logout durch abgelaufenes Token
  db.auth.onAuthStateChange((event,session)=>{
    if(event==="SIGNED_OUT"&&S.view!=="auth"){
      S.session=null;S.entries=[];
      set({view:"auth",authMode:"login"});
    }
  });

  document.addEventListener("click",(e)=>{
    if(!S.menuOpen)return;
    const wrap=document.querySelector(".menu-wrap");
    if(wrap&&wrap.contains(e.target))return;
    set({menuOpen:false});
  });
  setInterval(async()=>{
    if(!S.session||_syncing)return;
    // Letzter Upload fehlgeschlagen: erst erneut hochladen, nie die Cloud ueber
    // lokale, noch nicht gesicherte Aenderungen legen.
    if(_dirty){await syncToSupabase(S.entries);return;}
    const gen=_syncGen;
    const cloud=await loadFromSupabase(true);
    // Antwort verwerfen, wenn sich waehrend des Ladens lokal was getan hat.
    if(!cloud||_syncing||_dirty||gen!==_syncGen)return;
    if(JSON.stringify(cloud)!==JSON.stringify(S.entries)){
      S.entries=cloud;
      localStorage.setItem(KEY,JSON.stringify(cloud));
      markSynced(cloud);
      if(S.view==="list") render();
    }
  }, 10000);
})();
</script>
