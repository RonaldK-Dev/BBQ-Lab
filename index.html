<body>
<div id="root"></div>
<script>
const KEY="bbq-tasting-log";
const SUPABASE_URL="https://oltntsahncrrseufbowj.supabase.co";
const SUPABASE_KEY="sb_publishable_Wz9U4K2Sb6ooyKWLvIb1oQ_0KT2qKYy";
const UNITS=["TL","EL","Cup","g","ml","Prise","\u2013"];
const FRACS=["\u00bc","\u00bd","\u00be","1","1\u00bd","2","3","4"];
const SC={"in Arbeit":"#f59e0b","fertig":"#10b981","verworfen":"#ef4444"};
const SI={"in Arbeit":"\ud83d\udd2c","fertig":"\u2705","verworfen":"\u274c"};

function load(){try{return JSON.parse(localStorage.getItem(KEY))||[];}catch{return[];}}
function save(entries){
  localStorage.setItem(KEY,JSON.stringify(entries));
  syncToSupabase(entries);
}

let _sb = null;
function getSB(){
  if(!_sb) _sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  return _sb;
}

async function syncToSupabase(entries){
  try{
    const db = getSB();
    for(const entry of entries){
      await db.from("entries").upsert({id:entry.id, data:entry, updated_at: new Date().toISOString()});
    }
    console.log("Sync OK:", entries.length, "entries");
  }catch(e){console.log("Sync error:",e);}
}

async function loadFromSupabase(){
  try{
    const db = getSB();
    const {data, error} = await db.from("entries").select("*").order("updated_at", {ascending:false});
    if(error) throw error;
    if(data && data.length > 0){
      const entries = data.map(r => r.data);
      localStorage.setItem(KEY, JSON.stringify(entries));
      return entries;
    }
  }catch(e){console.log("Load error:",e);}
  return null;
}
async function uploadPhoto(entryId,file){
  const ext=file.name.split(".").pop()||"jpg";
  const path=entryId+"."+ext;
  const db=getSB();
  const {data,error}=await db.storage.from("recipe-photos").upload(path,file,{upsert:true});
  if(error)throw error;
  return db.storage.from("recipe-photos").getPublicUrl(path).data.publicUrl;
}
function stars(r){return[1,2,3,4,5].map(s=>s<=r?"\u2b50":"\u2606").join("");}
function matchesSearch(e,q){if(!q)return true;const t=q.toLowerCase();const hay=(e.name+" "+(e.anwendung||"")+" "+(e.notizen||"")+" "+(e.ingredients||[]).map(i=>i.name||"").join(" ")).toLowerCase();return hay.includes(t);}

function div(cls){const e=document.createElement("div");if(cls)e.className=cls;return e;}
function btn(cls,txt,cb){const e=document.createElement("button");e.className=cls;e.textContent=txt;e.addEventListener("click",cb);return e;}
function inp(cls,val,cb,extra){
  const e=document.createElement("input");
  e.className=cls;e.value=val||"";
  if(extra)Object.entries(extra).forEach(([k,v])=>e[k]=v);
  e.addEventListener("input",cb);
  return e;
}
function txt(cls,text){const e=document.createElement("p");e.className=cls;e.textContent=text;return e;}
function span(text){return document.createTextNode(text);}

  const dn=div("detail-name");dn.textContent=entry.name+(entry.version?" V."+entry.version:"");

  di.appendChild(dn);di.appendChild(dm);di.appendChild(ds);di.appendChild(pill);
  dh.appendChild(di);wrap.appendChild(dh);

  const is=div("section");

  const nb=div("note-box");

function openNew(){
  set({view:"form",focusedIng:0,pendingPhoto:null,current:{id:Date.now(),name:"",version:"",date:new Date().toISOString().split("T")[0],rating:0,anwendung:"",notizen:"",status:"in Arbeit",photoUrl:"",ingredients:[{qty:"",unit:"TL",name:""}]}});
}
function openEdit(e){
  set({view:"form",focusedIng:0,pendingPhoto:null,current:Object.assign({},e,{ingredients:e.ingredients.map(i=>Object.assign({},i))})});
}
async function doSave(){
  const c=S.current;if(!c.name.trim())return;
  if(S.pendingPhoto){
    try{c.photoUrl=await uploadPhoto(c.id,S.pendingPhoto);}catch(e){alert("❌ Foto-Upload fehlgeschlagen");}
    S.pendingPhoto=null;
  }
  const ex=S.entries.find(e=>e.id===c.id);
  S.entries=ex?S.entries.map(e=>e.id===c.id?c:e):[c,...S.entries];
  save(S.entries);set({view:"list"});
}
function doDownload(blob,filename){
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;a.click();URL.revokeObjectURL(a.href);
}
async function doExport(){
  const filename="bbq-lab-export-"+new Date().toISOString().split("T")[0]+".json";
  const blob=new Blob([JSON.stringify(S.entries,null,2)],{type:"application/json"});
  const file=new File([blob],filename,{type:"application/json"});
  if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:"BBQ Lab Export"});}
    catch(e){if(e.name!=="AbortError")doDownload(blob,filename);}
  }else{doDownload(blob,filename);}
  set({menuOpen:false,sidebarMenuOpen:false});
}
function doImport(){
  try{
    const d=JSON.parse(S.importText);
    if(!Array.isArray(d))throw 1;
    S.entries=d;save(d);set({importOpen:false,importText:""});
    alert("\u2705 Import erfolgreich!");
  }catch{alert("\u274c Ung\u00fcltiges Format.");}
}

function render(){
  const r=document.getElementById("root");
  const focused=document.activeElement;
  const searchFocused=focused&&focused.classList&&focused.classList.contains("search-input");
  const searchPos=searchFocused?focused.selectionEnd:null;
  r.innerHTML="";
  const isDesktop=window.innerWidth>=768;
  if(S.view==="list"){
    r.appendChild(renderList());
  }else if(S.view==="form"){
    if(isDesktop){
      r.appendChild(renderList());
      const ov=div("desktop-modal-overlay");
      const inner=div("desktop-modal-inner");
      inner.appendChild(renderForm());
      ov.appendChild(inner);
      ov.addEventListener("click",e=>{if(e.target===ov)set({view:"list"});});
      r.appendChild(ov);
    }else{r.appendChild(renderForm());}
  }else if(S.view==="detail"){
    if(isDesktop){
      r.appendChild(renderList());
      const ov=div("desktop-modal-overlay");
      const inner=div("desktop-modal-inner");
      inner.appendChild(renderDetail());
      ov.appendChild(inner);
      ov.addEventListener("click",e=>{if(e.target===ov)set({view:"list"});});
      r.appendChild(ov);
    }else{r.appendChild(renderDetail());}
  }
  if(searchFocused){
    const inputs=document.querySelectorAll(".search-input");
    for(const inp of inputs){
      if(inp.offsetParent!==null){
        inp.focus();
        if(searchPos!==null)inp.setSelectionRange(searchPos,searchPos);
        break;
      }
    }
  }
}
// Pull-to-refresh
let ptStart=0, ptEl=null;
function initPTR(){
  ptEl=document.createElement("div");
  ptEl.className="ptr";
  ptEl.innerHTML='<div class="ptr-spinner"></div><span class="ptr-text">Aktualisieren...</span>';
  document.body.prepend(ptEl);

  document.addEventListener("touchstart",e=>{
    if(window.scrollY===0) ptStart=e.touches[0].clientY;
  },{passive:true});

  document.addEventListener("touchmove",e=>{
    if(!ptStart) return;
    const dist=e.touches[0].clientY-ptStart;
    if(dist>0 && dist<80){
      ptEl.style.height=dist*0.6+"px";
    }
  },{passive:true});

  document.addEventListener("touchend",async e=>{
    if(!ptStart) return;
    const dist=e.changedTouches[0].clientY-ptStart;
    ptStart=0;
    if(dist>60){
      ptEl.style.height="44px";
      setTimeout(()=>location.reload(),400);
    } else {
      ptEl.style.height="0";
    }
  },{passive:true});
}

(async function init(){
  const cloud = await loadFromSupabase();
  if(cloud && cloud.length > 0){
    S.entries = cloud;
  } else {
    S.entries = load();
  }
  render();
  initPTR();
  document.addEventListener("click",(e)=>{
    if(!S.menuOpen)return;
    const wrap=document.querySelector(".menu-wrap");
    if(wrap&&wrap.contains(e.target))return;
    set({menuOpen:false});
  });
  setInterval(async()=>{
    const cloud=await loadFromSupabase();
    if(cloud&&cloud.length>0&&JSON.stringify(cloud)!==JSON.stringify(S.entries)){
      S.entries=cloud;
      if(S.view==="list") render();
    }
  }, 10000);
})();
</script>
