name: Supabase Keep-Alive

# Verhindert dass das kostenlose Supabase-Projekt nach 7 Tagen Inaktivität
# automatisch pausiert wird. Feuert alle 3 Tage einen minimalen REST-Call
# gegen die entries-Tabelle — reicht Supabase als "Aktivität" aus.

on:
  schedule:
    # Alle 3 Tage um 12:00 UTC (Mo/Do/So bei ungeraden Wochen wechselnd)
    - cron: '0 12 */3 * *'
  workflow_dispatch: # ermöglicht manuellen Trigger via GitHub-UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://oltntsahncrrseufbowj.supabase.co/rest/v1/entries?select=id&limit=1" \
            -H "apikey: sb_publishable_Wz9U4K2Sb6ooyKWLvIb1oQ_0KT2qKYy" \
            -H "Authorization: Bearer sb_publishable_Wz9U4K2Sb6ooyKWLvIb1oQ_0KT2qKYy")
          echo "HTTP Status: $RESPONSE"
          if [ "$RESPONSE" -eq 200 ] || [ "$RESPONSE" -eq 206 ]; then
            echo "✅ Supabase-Projekt ist aktiv"
            exit 0
          else
            echo "❌ Unerwarteter Status-Code: $RESPONSE"
            exit 1
          fi
