name: Supabase Keep-Alive

# Prüft alle 3 Tage den Supabase-Projekt-Status über die Management API und
# stößt bei Bedarf automatisch einen Restore an, statt nur einen Datenbank-Ping
# zu loggen — verhindert, dass das Free-Tier-Projekt nach einer Pause offline
# bleibt, bis das jemand manuell bemerkt.

on:
  schedule:
    - cron: '0 12 */3 * *'
  workflow_dispatch: # ermöglicht manuellen Trigger via GitHub-UI

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Projekt-Status prüfen und ggf. restaurieren
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          PROJECT_REF="oltntsahncrrseufbowj"
          STATUS=$(curl -s --retry 3 --retry-delay 10 --max-time 15 \
            "https://api.supabase.com/v1/projects/$PROJECT_REF" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | jq -r '.status // "UNKNOWN"')
          echo "Projekt-Status: $STATUS"

          if [ "$STATUS" = "ACTIVE_HEALTHY" ]; then
            echo "✅ Projekt ist aktiv"
            exit 0
          fi

          echo "⚠️ Projekt ist $STATUS — starte Restore..."
          curl -s --retry 3 --retry-delay 10 --max-time 15 -X POST \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/restore" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" -d '{}'
          echo "🔄 Restore angestoßen — Projekt braucht ein bis zwei Minuten zum Hochfahren"
